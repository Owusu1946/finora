packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 blocks dependency lifecycle scripts unless they are approved here.
# Entries are scoped to packages this generated stack can pull in.
allowBuilds:
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  workerd: true

overrides:
  lightningcss: 1.30.1
  react: 19.1.0
  react-dom: 19.1.0
  '@assistant-ui/core': 0.3.5
  '@assistant-ui/store': 0.3.3
  assistant-stream: 0.3.33

minimumReleaseAgeExclude:
  - '@assistant-ui/core@0.3.5'
  - '@assistant-ui/store@0.3.3'
  - assistant-stream@0.3.33
  - '@mhaadi/thinking-orbs-native@0.1.1'
  - '@legendapp/list@3.3.5'
  - '@ai-sdk/gateway@4.0.52'
  - ai@7.0.65
